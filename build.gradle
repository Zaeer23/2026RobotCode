plugins {
    id "java"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def ROBOT_MAIN_CLASS = "frc.robot.Main"

// Define my targets (RoboRIO) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.frc.getTeamNumber()
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                frcJava(getArtifactTypeClass('FRCJavaArtifact')) {
                }

                // Static files artifact
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/lvuser/deploy'
                    deleteOldFiles = false // Change to true to delete files on roboRIO that no
                                           // longer exist in deploy directory of this project
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcJava

// Set to true to use debug for all targets including JNI, which will drastically impact
// performance.
wpi.java.debugJni = false

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
// Also defines JUnit 5.
dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    roborioDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.roborio)
    roborioDebug wpi.java.vendor.jniDebug(wpi.platforms.roborio)

    roborioRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.roborio)
    roborioRelease wpi.java.vendor.jniRelease(wpi.platforms.roborio)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    // A fresh JVM per test class. Tests that boot the whole RobotContainer open every motor
    // controller's CAN id, REVLib refuses to open an id twice in one process, and nothing closes
    // them again -- so sharing a JVM made any later test that builds a subsystem fail on whichever
    // class happened to run first.
    forkEvery = 1
}

// Simulation configuration (e.g. environment variables).
wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation()

// Setting up my Jar File. In this case, adding all libraries into the main jar ('fat jar')
// in order to make them all available at runtime. Also adding the manifest so WPILib
// knows where to look for our Robot Class.
jar {
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    from('src') { into 'backup/src' }
    from('vendordeps') { into 'backup/vendordeps' }
    from('build.gradle') { into 'backup' }
    manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Configure jar and deploy tasks
deployArtifact.jarTask = jar
wpi.java.configureExecutableTasks(jar)
wpi.java.configureTestTasks(test)

// Configure string concat to always inline compile
tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
}

// ---------------------------------------------------------------------------
// Driver station dashboard
//
// A desktop Swing app, NOT robot code. The roboRIO is headless, so this runs on the driver
// station laptop and talks to the robot over NetworkTables -- the same way Shuffleboard did.
//
// It lives in its own source set so it never ends up in the robot JAR: it pulls in Swing and an
// MP3 decoder, neither of which belongs on the robot.
//
//   ./gradlew dashboard            launch it
//   ./gradlew dashboardJar         build a double-clickable jar
// ---------------------------------------------------------------------------
sourceSets {
    dashboard {
        java {
            srcDir 'src/dashboard/java'
        }
        resources.srcDir 'src/dashboard/resources'

        // One robot class is shared: the auto preview builder. With it the dashboard draws
        // routines from this project's own deploy folder when no robot is connected, using
        // exactly the code the robot uses. It depends only on libraries, never on robot code.
        //
        // It is taken from main's COMPILED OUTPUT rather than by listing src/main/java as a
        // second source directory here. Gradle is happy to have one folder in two source sets
        // with include filters, but Eclipse -- which is what the VS Code Java extension runs on
        // -- requires every source folder to belong to exactly one classpath entry. Sharing the
        // folder made the project model fail to import, so the editor could not resolve any type
        // in frc.robot (RobotContainer was unresolvable from its own package) and showed a few
        // hundred phantom errors, while gradle built the whole time without complaint.
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

dependencies {
    // Pure-Java MP3 decoder. Decoding to PCM ourselves (rather than using a black-box player)
    // is what makes both the volume control and the visualiser possible: we hold the samples.
    dashboardImplementation 'javazoom:jlayer:1.0.1'
    // Modern flat look-and-feel for Swing. Gives every stock control (combo boxes, lists, tabs,
    // scrollbars, the title bar) the dark, rounded styling the custom-painted panels use, so the
    // whole window reads as one app instead of Windows 98 controls around a custom dashboard.
    dashboardImplementation 'com.formdev:flatlaf:3.5.4'
    dashboardImplementation wpi.java.deps.wpilib()
    dashboardImplementation wpi.java.vendor.java()

    // NetworkTables needs its native libraries on the desktop too. Without these the client
    // throws "ntcorejni could not be loaded from path" the moment it starts.
    dashboardRuntimeOnly wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
}

// The dashboard's sources use characters like the degree sign and middle dot in on-screen text.
// Without this, javac on Windows reads them as cp1252 and the screen shows mojibake.
compileDashboardJava.options.encoding = 'UTF-8'

task dashboard(type: JavaExec) {
    group = 'robot'
    description = 'Launch the driver station dashboard on this computer.'
    // NetworkTables is native. extractReleaseNative unpacks the desktop .dll files that
    // GradleRIO ships as zips, and the JVM needs to be told where they landed.
    dependsOn 'extractReleaseNative'
    systemProperty 'java.library.path', file('build/jni/release').absolutePath
    classpath = sourceSets.dashboard.runtimeClasspath
    mainClass = 'frc.dashboard.DashboardApp'
}

task dashboardJar(type: Jar) {
    group = 'robot'
    description = 'Build a standalone dashboard jar.'
    dependsOn 'extractReleaseNative'
    archiveBaseName = 'dashboard'
    manifest { attributes 'Main-Class': 'frc.dashboard.DashboardApp' }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.dashboard.output
    // The shared preview builder now lives in main's output rather than being recompiled into
    // the dashboard source set, so pull just that class in. Taking all of main's output would
    // drag the robot classes, and their HAL dependencies, into a jar meant to run on a laptop.
    from(sourceSets.main.output) {
        include 'frc/robot/auto/AutoPreviewBuilder*.class'
    }
    from {
        sourceSets.dashboard.runtimeClasspath
            .filter { it.name.endsWith('.jar') }
            .collect { zipTree(it) }
    }
}

// Stages the dashboard so it can be launched without gradle: the fat jar plus the native
// NetworkTables libraries it needs beside it.
task dashboardBundle(type: Copy) {
    group = 'robot'
    description = 'Build a standalone, double-clickable dashboard into build/dashboard.'
    dependsOn 'dashboardJar', 'extractReleaseNative'
    into "$buildDir/dashboard"
    from(tasks.dashboardJar) { into '.' }
    from("$buildDir/jni/release") { into 'natives' }
}

// Regenerates the REBUILT autonomous routines. Replaces tools/generate_rebuilt_autos.py, which
// cannot run here: the only python on this machine is the Microsoft Store stub.
task generateAutos(type: JavaExec) {
    group = 'robot'
    description = 'Regenerate the PathPlanner autos and paths, then run ./gradlew test.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'frc.robot.auto.RebuiltAutoGenerator'
    args projectDir.toString()
}
